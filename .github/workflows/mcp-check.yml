name: MCP checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: windows-latest
            node: '22.22.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run catalog:check
      - run: npm run test:package
